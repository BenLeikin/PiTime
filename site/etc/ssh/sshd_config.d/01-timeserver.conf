# SSH hardening for the time server. sshd reads this before the rest of
# sshd_config, and the first value it sees for a setting wins.
#
# The account that logs in has passwordless sudo, so a guessed password would
# be root. Keys work from anywhere; passwords only from this network. Change
# the address range to your own LAN, or delete the Match block to allow keys
# only.
X11Forwarding no
PasswordAuthentication no

Match Address 10.0.0.0/22,127.0.0.1,::1
    PasswordAuthentication yes
