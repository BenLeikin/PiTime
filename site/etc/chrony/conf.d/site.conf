# Settings that belong to this particular server. chrony.conf includes every
# *.conf file in /etc/chrony/conf.d. Change these for your own site.

# Who may use this server. "allow all" serves anyone who can reach it; for a
# LAN-only server use your own networks instead, for example:
#   allow 192.168.0.0/16
#   allow 10.0.0.0/8
allow all

# NTS (Network Time Security) server. Remove this block if you do not use
# NTS. The certificate must cover the host name clients connect to.
ntsserverkey /etc/chrony/nts/privkey.key
ntsservercert /etc/chrony/nts/fullchain.crt
ntsport 4460
ntsdumpdir /var/lib/chrony
ntsntpserver time.pilg0re.net
