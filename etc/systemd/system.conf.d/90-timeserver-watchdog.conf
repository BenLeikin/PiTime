# Use the Pi's hardware watchdog. systemd resets it every few seconds; if the
# system hangs hard enough that it stops (a kernel lockup, say), the watchdog
# reboots the Pi on its own instead of it sitting frozen until someone notices.
# The BCM2835 watchdog allows at most about 15 s.
[Manager]
RuntimeWatchdogSec=15s
# A reboot that itself hangs is forced after this long.
RebootWatchdogSec=2min
