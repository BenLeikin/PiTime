# Internet sanity-check sources
pool time.cloudflare.com iburst maxsources 4
pool 2.pool.ntp.org iburst maxsources 3

# Serving. Who may use the server ("allow ...") is a site setting: see
# /etc/chrony/conf.d/site.conf, included below.
local stratum 10

# Rate limits, per client address, so the server cannot be used to flood
# someone else or be swamped by one misbehaving client. NTP: on average one
# reply every 2 s (interval 1 = 2^1 s) after a burst of 16; "leak 2" still
# answers a quarter of the excess so a limited client keeps roughly in sync.
# NTS key exchange is much more work per request, so it gets a tighter limit.
ratelimit interval 1 burst 16 leak 2
ntsratelimit interval 3 burst 8 leak 2

# Behavior
makestep 0.1 3
maxupdateskew 100.0
maxdistance 16.0
# One good source is enough: with the internet down, the GPS (PPS numbered by
# NMEA) must still discipline the clock. When the pools are reachable they
# still outvote a GPS that disagrees with them.
minsources 1
rtcsync
leapsectz right/UTC

# Standard
keyfile /etc/chrony/chrony.keys
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
# Only the logs something reads: tracking and tempcomp feed
# tools/fit_tempcomp.py. Each logged line makes the SD card rewrite a block,
# and measurements, statistics and refclocks (several lines a second between
# them) were most of the card's writes. The dashboard takes its PPS samples
# from chronyc instead. Add them back temporarily when debugging.
log tracking tempcomp

# Temperature compensation, calibration stage. chrony reads the CPU
# temperature (millidegrees C) every 30 s and logs it to tempcomp.log. All
# coefficients are zero, so no compensation is applied yet: the point is to
# collect temperature next to the frequency in tracking.log for a few days,
# then fit T0/k0/k1/k2 (or a points file) and put them here.
tempcomp /sys/class/thermal/thermal_zone0/temp 30 0 0 0 0
hwclockfile /etc/adjtime
cmdallow 127.0.0.1
clientloglimit 10000000

# Site-specific settings: who may use the server, and the NTS certificate and
# host name. This repository's copy is site/etc/chrony/conf.d/site.conf.
confdir /etc/chrony/conf.d

# GPS time of day from gpsd over shared memory. gpsd is started with
# "/dev/serial0 /dev/pps0", which gives these SHM units:
#   0 = time from the NMEA sentences on /dev/serial0   <- used here
#   2 = the pulse on /dev/pps0, with the second taken from the system clock
# Unit 2 looks precise but cannot say which second it is, so it must not be
# what PPS is locked to. The sentences arrive about 0.070 s after the second
# (measured with ntpshmmon with the GPS at 115200 baud, which timeserver-tune
# sets; at 9600 baud it is about 0.13 s). "offset" corrects for that, and the
# lock below needs the result to be within 0.2 s of the truth.
refclock SHM 0 refid NMEA precision 1e-3 offset 0.070 delay 0.2 noselect
# PPS pulse from GPIO (high precision, used for sync)
refclock PPS /dev/pps0 refid PPS lock NMEA precision 1e-9 prefer
