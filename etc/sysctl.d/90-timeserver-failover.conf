# Wired and Wi-Fi carry the same address (see README, "Wired + Wi-Fi failover").
# By default Linux answers ARP for that address on both interfaces, so with the
# cable plugged in a client can learn the Wi-Fi MAC and send its NTP requests
# over Wi-Fi while the replies leave by cable. arp_filter makes each interface
# answer only if the reply would be routed out of it, i.e. only the preferred
# link answers.
net.ipv4.conf.all.arp_filter = 1
